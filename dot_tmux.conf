# ===========================================================
#  paste / clipboard を快適にする最小設定
#  ※ 旧 tmux-neovim-ide の壊れた symlink を置き換えたもの
# ===========================================================

# bracketed paste / エスケープ列の取りこぼし防止
# (デフォルトの遅延が貼り付けの分割・改行化の一因になる)
set -sg escape-time 10

# OSC52 でシステムクリップボード連携 (nvim 0.10+ / SSH越しでも有効)
set -g set-clipboard on

# 端末の true color / clipboard 機能を tmux に伝える
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",*:clipboard"

# OSC パススルー (nvim -> 端末のクリップボード等)
set -g allow-passthrough on

# -----------------------------------------------------------
# TPM (既にインストール済み)。プラグインを使うなら必ず最終行に置く
# -----------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
